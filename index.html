<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10182B">
<title>אנגלית בריטית</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>

<!-- ── פס הפלטפורמה: הסימן המזהה של האפליקציה ──────────────────────── -->
<header class="bar" id="bar">
  <div class="bar__row">
    <button class="bar__back" id="back" hidden aria-label="חזרה">→</button>
    <div class="bar__title" id="barTitle">אנגלית בריטית</div>
    <div class="bar__net" id="net" aria-live="polite"></div>
  </div>
  <div class="line" id="line" hidden aria-hidden="true"></div>
</header>

<main id="view"></main>

<!-- ── מסך הבית ────────────────────────────────────────────────────── -->
<template id="tpl-home">
  <section class="pad">
    <p class="eyebrow">RECEIVED PRONUNCIATION · B2–C1</p>
    <h1 class="display">תרגול<br>אנגלית בריטית</h1>

    <div class="plate" id="readiness">
      <div class="plate__row">
        <span class="plate__k">שאלות זמינות</span>
        <span class="plate__v num" id="statAvail">—</span>
      </div>
      <div class="plate__row">
        <span class="plate__k">נענו עד כה</span>
        <span class="plate__v num" id="statDone">—</span>
      </div>
      <div class="plate__row">
        <span class="plate__k">דיוק ב־20 האחרונות</span>
        <span class="plate__v num" id="statAcc">—</span>
      </div>
    </div>

    <h2 class="sect">מה מתרגלים</h2>
    <button class="pick" data-game="drill">
      <span class="pick__en" dir="ltr">DRILL</span>
      <span class="pick__he">אימון מעורב</span>
      <span class="pick__note">דקדוק, ניבים, תיקון שגיאות, תרגום</span>
    </button>
    <button class="pick pick--alt" data-game="wordle">
      <span class="pick__en" dir="ltr">SPELLING</span>
      <span class="pick__he">ניחוש מילה</span>
      <span class="pick__note">איות בריטי · 6 ניסיונות</span>
    </button>

    <button class="pick pick--speak" data-game="speak">
      <span class="pick__en" dir="ltr">SPEAKING</span>
      <span class="pick__he">הגייה וחיקוי</span>
      <span class="pick__note" id="speakNote">מילים בודדות עם ניקוד · משפטים לחיקוי</span>
    </button>
    <button class="pick pick--vocab" data-nav="vocab">
      <span class="pick__en" dir="ltr">VOCABULARY</span>
      <span class="pick__he">אוצר המילים שלי</span>
      <span class="pick__note" id="vocabNote">הוסף מילים והן ייכנסו לתרגול</span>
    </button>
    <button class="pick pick--flight" data-nav="flight">
      <span class="pick__en" dir="ltr">FLIGHT KIT</span>
      <span class="pick__he" id="flightLabel">מצב טיסה</span>
      <span class="pick__note" id="flightNote">הכנה לתרגול בלי רשת</span>
    </button>

    <h2 class="sect">היכן אתה חלש</h2>
    <div id="weakList" class="weak"></div>

    <h2 class="sect">חשבון וסנכרון</h2>
    <div class="acct" id="acct"></div>

    <button class="ghost" id="toStats">כל הנתונים</button>
    <p class="foot" id="footNote"></p>
  </section>
</template>

<!-- ── מסך תרגול ───────────────────────────────────────────────────── -->
<template id="tpl-play">
  <section class="pad">
    <p class="eyebrow" id="qMeta"></p>
    <div id="qBody"></div>
    <div class="verdict" id="verdict" hidden>
      <p class="verdict__head" id="verdictHead"></p>
      <p class="verdict__fix" id="verdictFix" dir="ltr" hidden></p>
      <p class="verdict__why" id="verdictWhy"></p>
      <button class="cta" id="next">הבא</button>
    </div>
  </section>
</template>

<!-- ── סיכום סבב ───────────────────────────────────────────────────── -->
<template id="tpl-done">
  <section class="pad">
    <p class="eyebrow">END OF SESSION</p>
    <h1 class="display" id="doneScore"></h1>
    <div class="plate" id="doneList"></div>
    <button class="cta" id="again">סבב נוסף</button>
    <button class="ghost" id="doneHome">חזרה</button>
  </section>
</template>

<!-- ── מצב טיסה ────────────────────────────────────────────────────── -->
<template id="tpl-flight">
  <section class="pad">
    <p class="eyebrow">OFFLINE KIT</p>
    <h1 class="display">מצב טיסה</h1>

    <div class="gauge" id="gauge">
      <div class="gauge__bar"><span id="gaugeFill"></span><i id="gaugeCap"></i></div>
      <div class="gauge__legend">
        <span><b id="gaugeUsed">—</b> בשימוש</span>
        <span><b id="gaugeCapTxt">100MB</b> תקציב</span>
        <span><b id="gaugeFree">—</b> פנוי במכשיר</span>
      </div>
      <p class="gauge__note" id="gaugeNote"></p>
    </div>

    <div id="kitPanel"></div>
  </section>
</template>

<!-- ── אוצר מילים ──────────────────────────────────────────────────── -->
<template id="tpl-vocab">
  <section class="pad">
    <p class="eyebrow">VOCABULARY</p>
    <h1 class="display">אוצר המילים שלי</h1>

    <div class="add">
      <input class="field" id="wordIn" dir="ltr" lang="en-GB"
             autocapitalize="off" autocomplete="off" autocorrect="off"
             spellcheck="false" placeholder="gobsmacked">
      <button class="cta" id="addWord">הוסף מילה</button>
      <p class="add__note" id="addNote">כל מילה נכנסת לתרגול כשלוש שאלות שונות</p>
    </div>

    <div id="vocabList" class="vlist"></div>
  </section>
</template>

<!-- ── נתונים ──────────────────────────────────────────────────────── -->
<template id="tpl-stats">
  <section class="pad">
    <p class="eyebrow">PROGRESS</p>
    <h1 class="display">הנתונים שלך</h1>
    <div id="statsBody"></div>
    <button class="danger" id="reset">איפוס כל ההתקדמות</button>
  </section>
</template>

<script type="module" src="js/app.js"></script>
</body>
</html>
